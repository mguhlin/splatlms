# Production Apache vhost. Copy to /etc/apache2/sites-available/splatlms.conf,
# edit paths + ServerName, then: a2enmod rewrite headers && a2ensite splatlms && systemctl reload apache2
<VirtualHost *:80>
    ServerName lms.example.org
    DocumentRoot /opt/courses/splatlms/public

    <Directory /opt/courses/splatlms/public>
        AllowOverride All          # the app ships an .htaccess front controller
        Require all granted
    </Directory>

    # Security — PHP2Shell mitigation for mod_php (php-fpm reads public/.user.ini).
    <IfModule mod_php.c>
        php_admin_flag session.upload_progress.enabled off
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/splatlms-error.log
    CustomLog ${APACHE_LOG_DIR}/splatlms-access.log combined

    # For HTTPS, run certbot or terminate TLS at your proxy, then redirect 80->443.
</VirtualHost>
